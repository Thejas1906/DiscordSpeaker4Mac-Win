name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Original Linux/Docker validation (unchanged intent) + real PulseAudio integration inside a container.
  linux-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install headless dependencies
        run: python -m pip install -r src/requirements.txt
      - name: Check source and tests
        run: |
          python -m compileall -q src tests
          bash -n src/audio_ctl.sh
          python -m unittest discover -s tests -v
      - name: Validate Compose without a real token
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build container
        run: docker build -t discordspeaker:test .
      - name: Linux PulseAudio integration (real pactl/parec in a container, no sound hardware)
        run: |
          docker build -t discordspeaker:linux-it -f tests/docker/Dockerfile .
          docker run --rm -v "$PWD:/work:ro" discordspeaker:linux-it \
            "mkdir -p /tmp/xdg/pulse && python /work/tests/docker/linux_integration.py"

  # Same unit suite on every desktop OS. Uses fake devices: no sound card, no Discord credentials.
  desktop-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libopus0 libportaudio2
      - name: libopus (macOS)
        if: runner.os == 'macOS'
        run: brew install opus
      - name: Install dependencies
        run: python -m pip install -r src/requirements-desktop.txt
      - name: Unit tests (fake devices, offscreen Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

  # Packaged builds. These jobs build the installers/bundles and smoke-test the packaged executable
  # (--selftest: Qt loads, engine process starts, libopus resolves). They do not capture real audio.
  package:
    needs: [desktop-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x86_64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build macOS app + DMG
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          brew install opus librespot
          python -m pip install -r src/requirements-build.txt
          packaging/build_macos.sh
          dist/DiscordSpeaker.app/Contents/MacOS/DiscordSpeaker --selftest
      - name: Build Windows app + installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          choco install innosetup rust -y --no-progress
          $env:PATH += ";$env:USERPROFILE\.cargo\bin"
          powershell -ExecutionPolicy Bypass -File packaging\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DiscordSpeaker-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*-setup.exe
          if-no-files-found: error
